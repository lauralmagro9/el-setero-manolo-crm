[project]
name = "el-setero-manolo-crm"
version = "0.1.0"
description = ""
authors = [
    {name = "lcalmagro",email = "99207162+lcalmagro@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "fastapi (>=0.162.3,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.33,<0.0.34)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "reportlab (>=5.1.0,<6.0.0)",
    "groq (>=1.0.0)"
]

[tool.poetry]
packages = [{include = "crm"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pypdf (>=7.0.1,<8.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
# The end-to-end test wipes the database and builds the frontend: tests/conftest.py skips it
# unless it is selected on purpose (`-m e2e` or its path / node id)
# Show the logs live while the tests run
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-7s %(name)s: %(message)s"
markers = ["e2e: builds and deploys the app locally on a freshly seeded database"]
